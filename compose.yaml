services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      OLLAMA_URL: http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
